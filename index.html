<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins CI/CD Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #74abe2, #5563c1); color: white; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .card { background: white; color: #333; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; max-width: 400px; }
        h1 { color: #5563c1; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; }
        .badge { background: #4CAF50; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Успешный Деплой!</h1>
        <p>Nginx контейнер собран и запущен автоматически с помощью Jenkins Pipeline.</p>
        <div class="badge">Статус: Live</div>
    </div>
</body>
</html>
